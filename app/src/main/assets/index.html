<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b4b"><title>SANON LIFE</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#162b40;background:#edf2f8}*{box-sizing:border-box}body{margin:0}header{background:#102b4b;color:white;padding:20px 16px}header h1{margin:0;font-size:24px}header p{margin:4px 0;color:#bcd1e7}main{max-width:850px;margin:auto;padding:14px 14px 90px}.card{background:white;border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #19365312}h2{font-size:19px;margin:0 0 12px}h3{margin:10px 0}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;box-shadow:0 -3px 15px #19365322;z-index:2}nav button{flex:1;max-width:150px;background:none;color:#405770;border:0;padding:13px 3px;font-size:12px}nav button.active{color:#0b65a8;font-weight:800;border-top:3px solid #0b65a8}.btn{background:#123e68;color:white;border:0;padding:11px 14px;border-radius:10px;cursor:pointer}.secondary{background:#e9f1f8;color:#123e68}.danger{background:#fbe9e9;color:#a52b2b}input,select,textarea{width:100%;border:1px solid #cbd7e4;border-radius:9px;padding:11px;font:inherit;margin:6px 0 12px}label{font-size:13px;font-weight:650}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:#f0f5fa;padding:14px;border-radius:12px}.tile b{display:block;font-size:22px;margin-top:5px}.muted{color:#65798d;font-size:13px}.item{border-bottom:1px solid #e9eef4;padding:11px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}.item:last-child{border:0}.pill{background:#e7f2fb;color:#185784;border-radius:30px;padding:3px 8px;font-size:11px}.hidden{display:none}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.notice{background:#fff5df;padding:12px;border-radius:10px;color:#79521c;font-size:13px}button{cursor:pointer}small{font-size:12px} @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}} </style></head><body><header><div style="max-width:850px;margin:auto"><h1>✦ SANON LIFE</h1><p>Ma vie, mes projets, mon organisation.</p></div></header><main><section id="home"></section><section id="tasks" class="hidden"></section><section id="money" class="hidden"></section><section id="cases" class="hidden"></section><section id="more" class="hidden"></section></main><nav><button data-tab="home" class="active">⌂<br>Accueil</button><button data-tab="tasks">☑<br>Agenda</button><button data-tab="money">€<br>Budget</button><button data-tab="cases">▣<br>Dossiers</button><button data-tab="more">⚙<br>Plus</button></nav><script>
const KEY='sanon-life-v1';const initial={tasks:[{id:1,title:'Suivre les demandes de prêt entre bibliothèques',cat:'Université',date:'',done:false},{id:2,title:'Vérifier le versement de l’APL et le loyer',cat:'Administration',date:'2026-11-05',done:false},{id:3,title:'Avancer sur le blog du Master EHST',cat:'Projets',date:'',done:false},{id:4,title:'Préparer les travaux du Master',cat:'Université',date:'',done:false}],transactions:[],cases:[],notes:[],settings:{income:579,rent:295}};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{db=structuredClone(initial)};function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function euro(n){return Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}function dateFmt(d){return d?new Date(d+'T12:00:00').toLocaleDateString('fr-FR'): 'Sans échéance'}function uid(){return Date.now()+Math.floor(Math.random()*10000)}function setTab(t){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));function del(type,id){if(confirm('Supprimer cet élément ?')){db[type]=db[type].filter(x=>x.id!==id);save()}}function taskToggle(id){const t=db.tasks.find(x=>x.id===id);t.done=!t.done;save()}function tasksHtml(arr){return arr.length?arr.map(t=>`<div class="item"><div><label style="font-size:15px;font-weight:500"><input type="checkbox" style="width:auto;margin:0 8px 0 0" ${t.done?'checked':''} onchange="taskToggle(${t.id})">${t.done?'<s>':''}${esc(t.title)}${t.done?'</s>':''}</label><div class="muted">${esc(t.cat)} · ${dateFmt(t.date)}</div></div><button class="btn danger" onclick="del('tasks',${t.id})">×</button></div>`).join(''):'<p class="muted">Aucune activité pour le moment.</p>'}function render(){let pending=db.tasks.filter(x=>!x.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));let received=db.transactions.filter(x=>x.type==='in').reduce((s,x)=>s+Number(x.amount),0),spent=db.transactions.filter(x=>x.type==='out').reduce((s,x)=>s+Number(x.amount),0);document.getElementById('home').innerHTML=`<div class="card"><div class="muted">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h2 style="margin-top:8px">Bienvenue dans ton espace 👋</h2><p>Voici tes priorités et tes engagements en un seul endroit.</p><div class="grid"><div class="tile">À faire<b>${pending.length}</b></div><div class="tile">Dossiers<b>${db.cases.length}</b></div><div class="tile">Dépenses saisies<b>${euro(spent)}</b></div><div class="tile">Solde des opérations<b>${euro(received-spent)}</b></div></div></div><div class="card"><h2>Mes prochaines priorités</h2>${tasksHtml(pending.slice(0,6))}<button class="btn secondary" onclick="setTab('tasks')">Ouvrir l'agenda</button></div><div class="card"><h2>Mes espaces</h2><div class="grid">${['🎓 Université','💼 Travail et stage','💶 Finances','🗂 Campus France','🏠 Administration','✍️ Blog et projets','⚽ Sport','👨‍👩‍👧 Famille'].map(x=>`<div class="tile">${x}</div>`).join('')}</div></div><div class="notice">Les exemples de tâches sont modifiables. Aucune synchronisation bancaire, universitaire ou administrative n'est active.</div>`;document.getElementById('tasks').innerHTML=`<div class="card"><h2>Ajouter une activité</h2><form onsubmit="addTask(event)"><label>Activité</label><input name="title" required placeholder="Ex. Préparer mon exposé"><label>Catégorie</label><select name="cat">${['Université','Travail','Stage','Administration','Campus France','Projets','Santé','Sport','Famille','Autre'].map(x=>`<option>${x}</option>`).join('')}</select><label>Date limite (facultative)</label><input name="date" type="date"><button class="btn">Enregistrer l'activité</button></form></div><div class="card"><h2>À faire (${pending.length})</h2>${tasksHtml(pending)}</div><div class="card"><h2>Terminées (${db.tasks.length-pending.length})</h2>${tasksHtml(db.tasks.filter(x=>x.done))}</div>`;document.getElementById('money').innerHTML=`<div class="card"><h2>Mon budget</h2><div class="grid"><div class="tile">Revenu mensuel de référence<b>${euro(db.settings.income)}</b></div><div class="tile">Loyer net de référence<b>${euro(db.settings.rent)}</b></div><div class="tile">Reste théorique après loyer<b>${euro(db.settings.income-db.settings.rent)}</b></div><div class="tile">Solde des opérations saisies<b>${euro(received-spent)}</b></div></div><p class="muted">Le reste théorique ne tient pas compte des autres charges. Les opérations enregistrées sont distinctes du budget de référence.</p><form onsubmit="setBudget(event)"><div class="row"><div><label>Revenu de référence (€)</label><input name="income" type="number" min="0" step="0.01" value="${db.settings.income}"></div><div><label>Loyer net (€)</label><input name="rent" type="number" min="0" step="0.01" value="${db.settings.rent}"></div></div><button class="btn secondary">Mettre à jour le budget</button></form></div><div class="card"><h2>Ajouter une opération</h2><form onsubmit="addTransaction(event)"><label>Type</label><select name="type"><option value="out">Dépense</option><option value="in">Revenu</option></select><label>Description</label><input name="label" required placeholder="Ex. Courses, salaire"><label>Montant (€)</label><input name="amount" required type="number" min="0.01" step="0.01"><label>Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="btn">Ajouter l'opération</button></form></div><div class="card"><h2>Historique</h2>${db.transactions.length?db.transactions.slice().reverse().map(t=>`<div class="item"><div>${esc(t.label)}<div class="muted">${dateFmt(t.date)}</div></div><b style="color:${t.type==='in'?'#147c57':'#a52b2b'}">${t.type==='in'?'+':'−'}${euro(t.amount)}</b><button class="btn danger" onclick="del('transactions',${t.id})">×</button></div>`).join(''):'<p class="muted">Aucune opération enregistrée.</p>'}</div>`;document.getElementById('cases').innerHTML=`<div class="card"><h2>Mes dossiers Campus France</h2><p class="muted">Crée une fiche par candidat. Évite d'y saisir des numéros de passeport ou des documents confidentiels : cette version conserve les informations uniquement dans le navigateur.</p><form onsubmit="addCase(event)"><label>Nom ou référence du candidat</label><input name="name" required placeholder="Ex. Candidat A"><label>Formation / objectif</label><input name="program" placeholder="Ex. Licence 3 sociologie"><label>Statut</label><select name="status"><option>En préparation</option><option>Soumis</option><option>Correction demandée</option><option>Entretien prévu</option><option>Terminé</option></select><label>Prochaine action</label><textarea name="next" rows="2" placeholder="Ex. Vérifier le relevé manquant"></textarea><button class="btn">Créer le dossier</button></form></div><div class="card"><h2>Dossiers enregistrés</h2>${db.cases.length?db.cases.map(c=>`<div class="item"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.program)} · <span class="pill">${esc(c.status)}</span></div><small>${esc(c.next)}</small></div><button class="btn danger" onclick="del('cases',${c.id})">×</button></div>`).join(''):'<p class="muted">Aucun dossier. Ajoute ton premier candidat.</p>'}</div>`;document.getElementById('more').innerHTML=`<div class="card"><h2>Mes notes et projets</h2><form onsubmit="addNote(event)"><label>Titre</label><input name="title" required placeholder="Ex. Projet de mémoire"><label>Notes</label><textarea name="body" required rows="4" placeholder="Écris ici tes idées, suivis et projets..."></textarea><button class="btn">Enregistrer la note</button></form>${db.notes.map(n=>`<div class="item"><div><b>${esc(n.title)}</b><p style="white-space:pre-wrap">${esc(n.body)}</p></div><button class="btn danger" onclick="del('notes',${n.id})">×</button></div>`).join('')}</div><div class="card"><h2>Mes données</h2><p class="muted">Les informations sont enregistrées localement dans ce navigateur. Elles ne se synchronisent pas entre appareils et peuvent disparaître si les données du navigateur sont effacées. Exporte régulièrement une sauvegarde.</p><div class="row"><button class="btn" onclick="exportData()">Exporter ma sauvegarde</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Importer une sauvegarde</button></div><input id="importFile" type="file" accept="application/json" onchange="importData(event)" style="display:none"><p><button class="btn danger" onclick="resetData()">Effacer mes données</button></p></div><div class="notice">Version 1.0 : gestion locale, sans connexion à une IA ni notifications automatiques. Pour des données sensibles, une version sécurisée avec authentification et serveur est nécessaire.</div>`}
function addTask(e){e.preventDefault();let f=new FormData(e.target);db.tasks.push({id:uid(),title:f.get('title'),cat:f.get('cat'),date:f.get('date'),done:false});save();e.target.reset()}function addTransaction(e){e.preventDefault();let f=new FormData(e.target);db.transactions.push({id:uid(),type:f.get('type'),label:f.get('label'),amount:Number(f.get('amount')),date:f.get('date')});save();e.target.reset()}function setBudget(e){e.preventDefault();let f=new FormData(e.target);db.settings={income:Number(f.get('income')),rent:Number(f.get('rent'))};save()}function addCase(e){e.preventDefault();let f=new FormData(e.target);db.cases.push({id:uid(),name:f.get('name'),program:f.get('program'),status:f.get('status'),next:f.get('next')});save();e.target.reset()}function addNote(e){e.preventDefault();let f=new FormData(e.target);db.notes.push({id:uid(),title:f.get('title'),body:f.get('body')});save();e.target.reset()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='sanon-life-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.tasks)||!Array.isArray(d.transactions)||!Array.isArray(d.cases)||!Array.isArray(d.notes)||!d.settings)throw Error('Format incorrect');if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){db=d;save()}}catch(err){alert('Impossible d’importer : '+err.message)}};r.readAsText(f)}function resetData(){if(confirm('Effacer définitivement toutes les données locales ?')){db=structuredClone(initial);save()}}render();
</script></body></html>
